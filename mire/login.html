<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | MUST Online Application System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Logo Area -->
  <header class="header">
    <div class="logo-area">
     <img src="logo.jpeg" alt="MUST University Logo" class="university-logo">
      <div class="uni-name">
        Mbarara University of Science and Technology
        <span>Online Application System (OAS)</span>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="main">
    <div class="card">
      <div class="card-header">
        <h1>Applicant Login</h1>
        <p>Access your application account</p>
      </div>

      <div class="card-body">
        <form action="#" method="post">
          <div class="form-group">
            <label for="username">Username / Email / ID Number</label>
            <input type="text" id="username" name="username" placeholder="Enter your username or email" required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
          </div>

          <div class="checkbox-group">
            <input type="checkbox" id="remember" name="remember">
            <label for="remember">Remember me on this device</label>
          </div>

          <button type="submit" class="btn btn-primary">Login</button>
        </form>

        <div class="extra-links">
          <a href="#">Forgot Password?</a>
        </div>

        <div class="divider">OR</div>

        <a href="register.html" class="btn btn-secondary">Create New Account</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>© 2026 Mbarara University of Science and Technology (MUST)</p>
    <p>Need help? Contact: admissions@must.ac.tz | +255 739 349 139</p>
  </footer>

</body>
</html>
