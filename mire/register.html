<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | MUST Online Application System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="logo-area">
    <img src="logo.jpeg" alt="MUST University Logo" class="university-logo">
      <div class="uni-name">
        Mbarara University of Science and Technology
        <span>Online Application System (OAS)</span>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="main">
    <div class="card">
      <div class="card-logo">
      <img src="logo.jpeg" alt="MUST Logo" class="logo-img"
        <h1>Create Account</h1>
        <p>Register to start your online application</p>
      </div>

      <div class="card-body">
        <form action="#" method="post">
          <div class="form-group">
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname" placeholder="As it appears on your certificates" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="email">Email Address</label>
              <input type="email" id="email" name="email" placeholder="example@email.com" required>
            </div>
            <div class="form-group">
              <label for="phone">Mobile Number</label>
              <input type="tel" id="phone" name="phone" placeholder="+255 7XX XXX XXX" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" placeholder="Min. 6 characters" required>
            </div>
            <div class="form-group">
              <label for="confirm">Confirm Password</label>
              <input type="password" id="confirm" name="confirm" placeholder="Re-enter password" required>
            </div>
          </div>

          <div class="checkbox-group">
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">
              I have read and agree to the University’s declaration on personal data collection and the application terms.
            </label>
          </div>

          <button type="submit" class="btn btn-primary">Create Account</button>
        </form>

        <div class="extra-links" style="margin-top: 1.5rem;">
          Already have an account? <a href="login.html">Login here</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>© 2026 Mbarara University of Science and Technology (MUST)</p>
    <p>Need help? Contact: admissions@must.ac.tz | +255 739 349 139</p>
  </footer>

</body>
</html>
